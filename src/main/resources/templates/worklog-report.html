<!doctype html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>لیست انجام وظایف آلتوس</title>
  <link rel="icon" type="image/png" sizes="512x512" th:href="@{/images/todo-logo.png}"><link rel="apple-touch-icon" th:href="@{/images/todo-logo.png}">
  <link th:href="@{/css/vazir.css}" rel="stylesheet"><link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <style>body{background:#f5f7fb;color:#1f2a44;font-family:Vazirmatn,Vazir,Tahoma,sans-serif}.report{max-width:1050px}.panel{background:#fff;border:1px solid #e4e8f1;border-radius:1rem;box-shadow:0 10px 28px rgba(35,48,82,.08)}.form-control{border-radius:.6rem}.total{background:#e9f8f5;color:#087d6c;border-radius:.8rem;padding:1rem;font-weight:700}.empty{padding:3.5rem;color:#6c7891;text-align:center}</style>
</head>
<body><main class="container report py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 fw-bold mb-1">لیست انجام وظایف آلتوس</h1><p class="text-secondary mb-0">گزارش کارکرد در بازهٔ تاریخ انتخاب‌شده</p></div><a href="/" class="btn btn-outline-secondary">بازگشت به فهرست</a></div>
  <section class="panel p-4 mb-4"><form id="rangeForm" class="row g-3 align-items-end"><input type="hidden" id="fromIso" th:value="${from}"><input type="hidden" id="toIso" th:value="${to}"><div class="col-md-4"><label class="form-label" for="fromJalali">از تاریخ (شمسی)</label><input id="fromJalali" class="form-control" placeholder="۱۴۰۵/۰۷/۰۱" required></div><div class="col-md-4"><label class="form-label" for="toJalali">تا تاریخ (شمسی)</label><input id="toJalali" class="form-control" placeholder="۱۴۰۵/۰۷/۳۰" required></div><div class="col-md-4"><button class="btn btn-primary w-100" type="submit">نمایش گزارش</button></div><div id="rangeError" class="text-danger small d-none">تاریخ‌ها را به‌صورت ۱۴۰۵/۰۷/۰۱ وارد کنید. تاریخ پایان باید برابر یا بعد از تاریخ شروع باشد.</div></form></section>
  <section class="panel overflow-hidden"><div class="d-flex justify-content-between align-items-center p-4 border-bottom"><div><h2 class="h5 fw-bold mb-1">زمان ثبت‌شده</h2><span class="text-secondary" id="activeRange"></span></div><div class="total"><span class="persian-number" th:text="${totalMinutes / 60}"></span> ساعت و <span class="persian-number" th:text="${totalMinutes % 60}"></span> دقیقه (جمع)</div></div><div th:if="${#lists.isEmpty(entries)}" class="empty">در این بازه زمانی هیچ کارکردی ثبت نشده است.</div><div th:unless="${#lists.isEmpty(entries)}" class="table-responsive"><table class="table mb-0 align-middle"><thead class="table-light"><tr><th>تسک</th><th>تاریخ و ساعت</th><th>توضیحات</th><th>مدت</th></tr></thead><tbody><tr th:each="entry : ${entries}"><td class="fw-semibold" th:text="${entry.taskTitle}"></td><td class="jalali-date" th:data-date="${entry.loggedAt}"></td><td th:text="${entry.description}"></td><td><span class="persian-number" th:text="${entry.durationMinutes / 60}"></span> ساعت و <span class="persian-number" th:text="${entry.durationMinutes % 60}"></span> دقیقه</td></tr></tbody></table></div></section></main>
<script>
const div=(a,b)=>Math.trunc(a/b),mod=(a,b)=>a-Math.trunc(a/b)*b,pad=n=>String(n).padStart(2,'0');
function jc(y){const b=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];let l=-14,p=b[0],j;for(let i=1;i<b.length;i++){let n=b[i];j=n-p;if(y<n)break;l+=div(j,33)*8+div(mod(j,33),4);p=n}let n=y-p;l+=div(n,33)*8+div(mod(n,33)+3,4);if(mod(j,33)===4&&j-n===4)l++;let gy=y+621,lg=div(gy,4)-div((div(gy,100)+1)*3,4)-150,m=20+l-lg;if(j-n<6)n=n-j+div(j+4,33)*33;return m}function g2d(y,m,d){let n=div((y+div(m-8,6)+100100)*1461,4)+div(153*mod(m+9,12)+2,5)+d-34840408;return n-div(div(y+100100+div(m-8,6),100)*3,4)+752}function d2g(j){let n=4*j+139361631;n+=4*div(3*div(4*n+183187720,146097),4)-3908;const i=div(mod(n,1461),4)*5+308;return{y:div(n,1461)-100100+div(8-div(i,153),6),m:mod(div(i,153),12)+1,d:mod(i,153)+1}}function j2g(y,m,d){return d2g(g2d(y+621,3,jc(y))+(m-1)*31-div(m,7)*(m-7)+d-1)}
function isoToJ(iso){const [y,m,d]=iso.slice(0,10).split('-').map(Number);return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(Date.UTC(y,m-1,d,12)))}function latinDigits(v){return v.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))}function persianDigits(v){return v.replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function parseJ(v){const normalized=latinDigits(v),x=normalized.match(/^(\d{4})\/(\d{2})\/(\d{2})$/);if(!x)return null;const g=j2g(+x[1],+x[2],+x[3]);const iso=`${g.y}-${pad(g.m)}-${pad(g.d)}`;return isoToJ(iso)===persianDigits(normalized)?iso:null}
const from=document.getElementById('fromJalali'),to=document.getElementById('toJalali');from.value=isoToJ(fromIso.value);to.value=isoToJ(toIso.value);activeRange.textContent=`از ${from.value} تا ${to.value}`;document.querySelectorAll('.persian-number').forEach(c=>c.textContent=persianDigits(c.textContent));document.querySelectorAll('.jalali-date').forEach(c=>{const v=c.dataset.date.replace('T',' ');c.textContent=`${isoToJ(v)}، ساعت ${persianDigits(v.slice(11,16))}`});rangeForm.addEventListener('submit',e=>{e.preventDefault();const f=parseJ(from.value),t=parseJ(to.value);if(!f||!t||f>t){rangeError.classList.remove('d-none');return}location.href=`/worklog-report?from=${f}&to=${t}`});
</script></body></html>
