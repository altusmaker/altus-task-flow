<!doctype html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گزارش کارکرد</title>
    <link rel="icon" type="image/png" sizes="512x512" th:href="@{/images/todo-logo.png}">
    <link th:href="@{/css/vazir.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/jalali-reminder.css}" rel="stylesheet">
    <style>body {
        background: #f5f7fb;
        color: #1f2a44;
        font-family: Vazirmatn, Vazir, Tahoma, sans-serif
    }

    .report {
        max-width: 1050px
    }

    .panel {
        background: #fff;
        border: 1px solid #e4e8f1;
        border-radius: 1rem;
        box-shadow: 0 10px 28px rgba(35, 48, 82, .08)
    }

    .form-control {
        border-radius: .6rem
    }

    .total {
        background: #e9f8f5;
        color: #087d6c;
        border-radius: .8rem;
        padding: 1rem;
        font-weight: 700
    }

    .empty-state {
        padding: 3.5rem;
        color: #6c7891;
        text-align: center
    }</style>
</head>
<body>
<main class="container report py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><h1 class="h3 fw-bold mb-1">گزارش کارکرد</h1>
            <p class="text-secondary mb-0">گزارش کارکرد در بازه تاریخ انتخاب‌شده</p></div>
        <a href="/" class="btn btn-outline-secondary">بازگشت به فهرست</a></div>
    <section class="panel p-4 mb-4">
        <form id="rangeForm" class="row g-3 align-items-end"><input type="hidden" id="fromIso" th:value="${from}"><input
                type="hidden" id="toIso" th:value="${to}">
            <div class="col-md-5 position-relative"><label class="form-label" for="fromPicker">از تاریخ
                (شمسی)</label><input id="fromPicker" class="form-control jalali-date-input" type="text"
                                     autocomplete="off"></div>
            <div class="col-md-5 position-relative"><label class="form-label" for="toPicker">تا تاریخ
                (شمسی)</label><input id="toPicker" class="form-control jalali-date-input" type="text"
                                     autocomplete="off"></div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" type="submit">نمایش گزارش</button>
            </div>
            <div id="rangeError" class="text-danger small d-none">تاریخ پایان باید برابر یا بعد از تاریخ شروع باشد.
            </div>
        </form>
    </section>
    <section class="panel overflow-hidden">
        <div class="d-flex justify-content-between align-items-center p-4 border-bottom">
            <div><h2 class="h5 fw-bold mb-1">زمان ثبت‌شده</h2><span class="text-secondary" id="activeRange"></span>
            </div>
            <div class="d-flex align-items-center gap-3"><a class="btn btn-success"
                                                            th:href="@{/worklog-report/export(from=${from},to=${to})}">دانلود
                اکسل</a>
                <div class="total"><span class="persian-number" th:text="${totalMinutes / 60}"></span> ساعت و <span
                        class="persian-number" th:text="${totalMinutes % 60}"></span> دقیقه (جمع)
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(entries)}" class="empty-state">در این بازه زمانی هیچ کارکردی ثبت نشده است.</div>
        <div th:unless="${#lists.isEmpty(entries)}" class="table-responsive">
            <table class="table mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>تسک</th>
                    <th>تاریخ و ساعت</th>
                    <th>توضیحات</th>
                    <th>مدت</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${entries}">
                    <td class="fw-semibold" th:text="${entry.taskTitle}"></td>
                    <td class="jalali-date" th:data-date="${entry.loggedAt}"></td>
                    <td th:text="${entry.description}"></td>
                    <td><span class="persian-number" th:text="${entry.durationMinutes / 60}"></span> ساعت و <span
                            class="persian-number" th:text="${entry.durationMinutes % 60}"></span> دقیقه
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script th:src="@{/js/jalali-picker.js(v=2)}"></script>
<script>
    const persianDigits = value => String(value).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    const fromPicker = JalaliDatePicker.create({
        input: document.getElementById('fromPicker'),
        valueInput: document.getElementById('fromIso')
    }), toPicker = JalaliDatePicker.create({
        input: document.getElementById('toPicker'),
        valueInput: document.getElementById('toIso')
    });
    document.getElementById('activeRange').textContent = 'از ' + JalaliDatePicker.formatGregorian(fromIso.value) + ' تا ' + JalaliDatePicker.formatGregorian(toIso.value);
    document.querySelectorAll('.persian-number').forEach(el => el.textContent = persianDigits(el.textContent));
    document.querySelectorAll('.jalali-date').forEach(el => {
        const value = el.dataset.date.replace('T', ' ');
        el.textContent = JalaliDatePicker.formatGregorian(value) + '، ساعت ' + persianDigits(value.slice(11, 16))
    });
    document.getElementById('rangeForm').addEventListener('submit', event => {
        event.preventDefault();
        if (!fromIso.value || !toIso.value || fromIso.value > toIso.value) {
            rangeError.classList.remove('d-none');
            return
        }
        location.href = '/worklog-report?from=' + fromIso.value + '&to=' + toIso.value
    });
</script>
</body>
</html>
