<!doctype html>
<html lang="fa" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلتوس تسک فلو</title>
    <link rel="icon" type="image/png" sizes="512x512" th:href="@{/images/todo-logo.png}">
    <link rel="apple-touch-icon" th:href="@{/images/todo-logo.png}">
    <link th:href="@{/css/vazir.css}" rel="stylesheet">
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/task-board.css}" rel="stylesheet">
    <link th:href="@{/css/jalali-reminder.css}" rel="stylesheet">
</head>
<body>
<main class="container-fluid py-4 px-lg-4 board-shell">
    <header class="board-header">
        <div>
            <div class="eyebrow">یک چک‌لیست ساده، با امکان ثبت کارکرد</div>
            <h1 class="board-title">آلتوس تسک‌فلو</h1>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary notify-button" href="/worklog-report">📊 گزارش کارکردها</a>
            <button onclick="requestNotificationPermission()" class="btn btn-outline-secondary notify-button">🔔 فعال‌سازی یادآوری مرورگر</button>
        </div>
    </header>
    <div class="row g-3">
        <div class="col-md-4" th:each="colStatus : ${T(com.altusstudio.taskflow.TaskStatus).values()}">
            <section class="column" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"
                     th:data-status="${colStatus.name()}">
                <div class="column-head"><span class="status-dot"></span>
                    <h2 class="column-title fw-bold" th:data-status="${colStatus.name()}"
                        th:text="${colStatus.label}"></h2><span class="task-count"
                                                                th:text="${(colStatus == T(com.altusstudio.taskflow.TaskStatus).TODO ? todos : (colStatus == T(com.altusstudio.taskflow.TaskStatus).IN_PROGRESS ? inProgress : dones)).size()}"></span>
                </div>
                <div class="task-list">
                    <div th:each="task : ${colStatus == T(com.altusstudio.taskflow.TaskStatus).TODO ? todos : (colStatus == T(com.altusstudio.taskflow.TaskStatus).IN_PROGRESS ? inProgress : dones)}"
                         class="task-card" draggable="true" ondragstart="drag(event)" ondragend="dragEnd(event)"
                         th:id="'task-' + ${task.id}" th:data-reminder="${task.reminderTime}"
                         th:data-title="${task.title}" th:data-label="${task.label}">
                        <div class="d-flex justify-content-between align-items-start gap-2"><strong class="task-title"
                                                                                                    th:text="${task.title}"></strong>
                            <button class="btn btn-close btn-xs flex-shrink-0" aria-label="حذف تسک"
                                    th:data-id="${task.id}" onclick="deleteTask(this.dataset.id)"></button>
                        </div>
                        <span th:if="${task.label}" class="task-label">🏷️ <span
                                th:text="${task.label}"></span></span>
                        <div class="task-meta mt-2">
                            <span th:if="${task.reminderTime}" class="reminder-badge">⏰ <span
                                th:text="${#temporals.format(task.reminderTime, 'HH:mm - yyyy/MM/dd')}"></span></span>
                            <div class="mt-2 d-flex justify-content-between align-items-center">
                                <span class="worklog-badge" th:id="'work-total-'+${task.id}">⏱️ <span
                                    th:text="${task.formattedTotalWork}"></span></span>
                                <button class="btn btn-outline-primary btn-xs" th:data-id="${task.id}"
                                        onclick="openWorklogModal(this.dataset.id)">+ ثبت کارکرد
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="column-footer mt-2 text-center">
                    <button class="btn add-task w-100 btn-sm" th:data-status="${colStatus.name()}"
                            onclick="openAddModal(this.dataset.status)">+ افزودن تسک
                    </button>
                </div>
            </section>
        </div>
    </div>
</main>
<div class="modal fade" id="addTaskModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 id="taskModalTitle" class="modal-title fw-bold">تسک جدید</h5>
                <button type="button" class="btn-close m-0" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body"><input type="hidden" id="newTaskStatus"><input type="hidden" id="editingTaskId">
                <div class="mb-3"><label class="form-label" for="newTaskTitle">عنوان</label><input type="text"
                                                                                                   id="newTaskTitle"
                                                                                                   class="form-control"
                                                                                                   placeholder="پاسخ به نامه ارزیابی">
                </div>
                <div class="mb-3"><label class="form-label" for="newTaskLabel">برچسب <span
                        class="text-muted">(اختیاری)</span></label><input type="search" id="newTaskLabel"
                                                                          class="form-control" list="taskLabels"
                                                                          placeholder="انتخاب برچسب متناسب"
                                                                          autocomplete="off">
                    <datalist id="taskLabels">
                        <option value="تحلیل">
                        <option value="مستند سازی">
                        <option value="پیاده سازی">
                        <option value="بررسی مشکل">
                        <option value="رفع خطا">
                        <option value="تست و ارزیابی">
                        <option value="درخواست پشتیبانی">
                        <option value="نسخه گذاری">
                        <option value="تغییر دیتابیسی">
                        <option value="پیگیری">
                        <option value="جلسات">
                        <option value="گزارشات">
                        <option value="امور اداری">
                        <option value="امور رفاهی">
                    </datalist>
                </div>
                <div class="position-relative"><label class="form-label" for="newTaskReminderDisplay">یادآور <span
                        class="text-muted">(اختیاری)</span></label><input type="hidden" id="newTaskReminder"><input
                        type="text" id="newTaskReminderDisplay" class="form-control jalali-date-input"
                        placeholder="انتخاب تاریخ و ساعت" autocomplete="off"></div>
            </div>
            <div class="modal-footer">
                <button id="saveTaskButton" type="button" class="btn btn-primary px-4" onclick="saveTask()">ذخیره تسک
                </button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="confirmTaskUpdateModal" tabindex="-1" aria-labelledby="confirmTaskUpdateTitle"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 id="confirmTaskUpdateTitle" class="modal-title fw-bold">تایید ویرایش تسک</h5>
                <button type="button" class="btn-close m-0" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">آیا از ویرایش این تسک اطمینان دارید؟</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">لفو</button>
                <button id="confirmTaskUpdateButton" type="button" class="btn btn-primary">اعمال تغییرات</button>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="worklogModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title fw-bold">ثبت کارکرد</h5>
                <button type="button" class="btn-close m-0" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body"><input type="hidden" id="worklogTaskId">
                <div class="mb-3"><label class="form-label" for="worklogDuration">مدت زمان</label><input type="text"
                                                                                                         id="worklogDuration"
                                                                                                         class="form-control"
                                                                                                         placeholder="1h 15m"
                                                                                                         autocomplete="off">
                    <div id="worklogDurationError" class="invalid-feedback">مدت زمان را با الگوی 4h 45m وارد کنید.
                    </div>
                </div>
                <div><label class="form-label" for="worklogDesc">توضیحات</label><textarea id="worklogDesc"
                                                                                          class="form-control" rows="3"
                                                                                          placeholder="چه کاری انجام شد؟"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary px-4" onclick="saveWorklog()">ثبت کارکرد</button>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/jalali-picker.js(v=2)}"></script>
<script th:src="@{/js/jalali-reminder.js(v=2)}"></script>
<script th:src="@{/js/task-board.js}"></script>
</body>
</html>
